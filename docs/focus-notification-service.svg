="auto"><path d="M11,0 L0,4.5 L11,9 z" fill="#9CA3AF"/></marker><marker id="ah-D97706" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#D97706"/></marker><marker id="as-D97706" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto"><path d="M11,0 L0,4.5 L11,9 z" fill="#D97706"/></marker><marker id="ah-111827" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#111827"/></marker><marker id="as-111827" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto"><path d="M11,0 L0,4.5 L11,9 z" fill="#111827"/></marker></defs><rect width="1860" height="960" fill="#FFFFFF"/>
<rect x="612.0" y="387.0" width="416" height="126" rx="18" fill="none" stroke="#22C55E" stroke-width="3" opacity="0.5"/>
<rect x="620.0" y="395.0" width="400" height="110" rx="12" fill="#DCFCE7" stroke="#22C55E" stroke-width="3.5"/>
<text x="820" y="428" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827">notification-service  :8093</text>
<text x="820" y="448" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">조건 변경 · 제보 결과를 사람마다 알림으로</text>
<text x="820" y="464" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">API 6개  (공개 6) · 이벤트는 받기만 함</text>
<text x="612.0" y="381.0" font-size="13" font-weight="bold" text-anchor="start" fill="#22C55E">이 레포</text>
<rect x="55.0" y="255.0" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.2"/>
<text x="180" y="278" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">gateway-server</text>
<text x="180" y="298" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">토큰 검증</text>
<text x="180" y="314" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">X-User-Id · X-User-Role 주입</text>
<rect x="55.0" y="505.0" width="250" height="110" rx="12" fill="#FFEDD5" stroke="#F97316" stroke-width="2.2"/>
<text x="180" y="530" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Kafka</text>
<text x="180" y="550" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">policy.changed · report.resolved</text>
<text x="180" y="566" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">account.withdrawn 을 받음</text>
<text x="180" y="582" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">한 건씩 · Inbox 로 한 번만</text>
<rect x="55.0" y="760.0" width="250" height="80" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2.2"/>
<text x="180" y="786" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">policy · report · auth</text>
<text x="180" y="806" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">조건 변경 · 처리 결과 · 탈퇴를 냄</text>
<rect x="670.0" y="80.0" width="300" height="80" rx="12" fill="#E0E7FF" stroke="#6366F1" stroke-width="2.2"/>
<text x="820" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">config-server</text>
<text x="820" y="126" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">포트 · DB</text>
<rect x="1410.0" y="80.0" width="300" height="80" rx="12" fill="#E0E7FF" stroke="#6366F1" stroke-width="2.2"/>
<text x="1560" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">eureka-server</text>
<text x="1560" y="126" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">등록 · lb:// 해석</text>
<rect x="1410.0" y="245.0" width="300" height="110" rx="12" fill="#FFEDD5" stroke="#F97316" stroke-width="2.2"/>
<text x="1560" y="270" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">PostgreSQL  notif_db</text>
<text x="1560" y="290" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">notification · notification_setting</text>
<text x="1560" y="306" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">+ outbox · inbox · 탈퇴 잠금 (advisory)</text>
<text x="1560" y="322" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">안 읽은 수도 DB 로 셈 — Redis 안 씀</text>
<rect x="1410.0" y="515.0" width="300" height="90" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2.2"/>
<text x="1560" y="538" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">user-service</text>
<text x="1560" y="558" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">조건 변경 알림을 받을 사람</text>
<text x="1560" y="574" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">GET /internal/favorites  100명씩</text>
<rect x="1410.0" y="675.0" width="300" height="90" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2.2"/>
<text x="1560" y="698" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">place-service</text>
<text x="1560" y="718" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">목록의 장소 이름</text>
<text x="1560" y="734" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">GET /internal/places?ids=  100곳씩</text>
<polyline points="305.0,300 470,300 470,420 620,420" fill="none" stroke="#3B82F6" stroke-width="2.4" marker-end="url(#ah-3B82F6)"/>
<rect x="314" y="276" width="175" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="318" y="288" font-size="13" font-weight="normal" text-anchor="start" fill="#3B82F6">목록 · 읽음 · 안 읽은 수 · 설정</text>
<polyline points="305.0,560 520,560 520,470 620,470" fill="none" stroke="#F97316" stroke-width="2.4" marker-end="url(#ah-F97316)"/>
<rect x="314" y="536" width="88" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="318" y="548" font-size="13" font-weight="normal" text-anchor="start" fill="#F97316">세 토픽을 받음</text>
<polyline points="180,760.0 180,615.0" fill="none" stroke="#9CA3AF" stroke-width="2.4" marker-end="url(#ah-9CA3AF)"/>
<rect x="192" y="720" width="34" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="196" y="732" font-size="13" font-weight="normal" text-anchor="start" fill="#9CA3AF">발행</text>
<polyline points="820,160.0 820,395.0" fill="none" stroke="#6366F1" stroke-width="2.4" marker-end="url(#ah-6366F1)"/>
<rect x="782" y="258" width="76" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="820.0" y="269.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#6366F1">기동 시 설정</text>
<polyline points="1020,450 1120,450 1120,120 1410.0,120" fill="none" stroke="#6366F1" stroke-width="2.4" marker-end="url(#ah-6366F1)"/>
<rect x="1183" y="193" width="34" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1200" y="205" font-size="13" font-weight="normal" text-anchor="middle" fill="#6366F1">등록</text>
<polyline points="1020,450 1120,450 1120,300 1410.0,300" fill="none" stroke="#F97316" stroke-width="2.4" marker-end="url(#ah-F97316)"/>
<rect x="1112" y="366" width="176" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1200" y="378" font-size="13" font-weight="normal" text-anchor="middle" fill="#F97316">JPA · Flyway V20 · 탈퇴 잠금</text>
<polyline points="1020,480 1200,480 1200,560 1410.0,560" fill="none" stroke="#16A34A" stroke-width="2.4" marker-end="url(#ah-16A34A)"/>
<rect x="1208" y="518" width="153" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1212" y="530" font-size="13" font-weight="normal" text-anchor="start" fill="#16A34A">조건 변경 알림을 만들 때만</text>
<polyline points="1020,495 1240,495 1240,720 1410.0,720" fill="none" stroke="#16A34A" stroke-width="2.4" marker-end="url(#ah-16A34A)"/>
<rect x="1248" y="678" width="88" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1252" y="690" font-size="13" font-weight="normal" text-anchor="start" fill="#16A34A">목록을 열 때만</text>
<text x="40" y="880" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">조건 변경은 그 장소를 즐겨찾기한 사람에게, 제보 결과는 제보한 사람에게 — 끈 사람과 탈퇴한 사람은 만들 때 거르고, 같은 장소의 안 읽은 조건 알림은 갈아 끼움</text>
<text x="40" y="902" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">장소 이름은 문구에 안 넣고 목록을 열 때 place 에 물음 (못 받으면 이름만 비움) · 알림을 만들 때 user 명단을 못 받으면 세 번 재시도 뒤 .dlq 로 감</text>
<text x="40" y="924" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">탈퇴하면 알림을 지우고 설정 행에 탈퇴 표시를 남김 — 늦게 온 알림거리는 그 표시를 보고 건너뜀 · 만들기와 탈퇴는 advisory 잠금 하나(공유 · 배타)로 한 줄로 섬</text>
<text x="1836" y="948" font-size="11" text-anchor="end" fill="#9CA3AF">notification-service 를 중심으로 · 직접 연결된 것만</text></svg>